version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: travel_hub_db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db
    networks:
      - travel_hub_network

  mongodb-express:
    image: mongo-express:latest
    container_name: travel_hub_mongo_express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password
      ME_CONFIG_MONGODB_URL: mongodb://admin:password@mongodb:27017/
    depends_on:
      - mongodb
    networks:
      - travel_hub_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: travel_hub_backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://admin:password@mongodb:27017/travel_hub?authSource=admin
      JWT_SECRET: your_jwt_secret_key_change_in_production
      PORT: 5000
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - travel_hub_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: travel_hub_frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - travel_hub_network

volumes:
  mongodb_data:

networks:
  travel_hub_network:
    driver: bridge
